<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the pairs</title>
    <style>
        :root {
            --primary: #1a6bb8;
            --primary-hover: #145491;
            --card-blue: #18a4e0;
            --bg-outer: #f0f4f8;
            --border-color: #cbd5e1;
            --text-dark: #1e293b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 15px;
            background: var(--bg-outer);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-box {
            background: #fff;
            border: 2px solid var(--primary);
            border-radius: 12px;
            width: 100%;
            max-width: 820px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            padding: 16px 24px 8px;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-badge {
            font-size: 14px;
            background: #e0f2fe;
            color: #0369a1;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* Сетка карточек */
        .grid-stage {
            padding: 16px 24px 24px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            min-height: 340px;
        }

        @media (max-width: 600px) {
            .grid-stage {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
        }

        /* 3D-переворот карточки */
        .card {
            aspect-ratio: 4 / 3;
            perspective: 1000px;
            cursor: pointer;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .card.matched {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.85);
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.45s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            text-align: center;
        }

        /* Рубашка карточки (голубая) */
        .card-front {
            background: linear-gradient(135deg, #22b2ee, var(--card-blue));
            border: 2px solid #0284c7;
            color: #fff;
            font-size: 28px;
            font-weight: 700;
        }

        .card-front:hover {
            filter: brightness(1.05);
        }

        /* Лицевая сторона (белая) */
        .card-back {
            background: #ffffff;
            border: 2px solid #94a3b8;
            color: var(--text-dark);
            transform: rotateY(180deg);
            font-size: 22px;
            font-weight: 700;
            flex-direction: column;
        }

        .card-back img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
            border-radius: 6px;
        }

        .emoji-pic {
            font-size: 46px;
            line-height: 1;
        }

        /* Нижняя панель */
        .footer {
            background: #e2e8f0;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            background: #fff;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
        }

        .btn:hover:not(:disabled) {
            background: #e0f2fe;
        }

        .btn.primary {
            background: var(--primary);
            color: #fff;
        }

        .btn.primary:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: default;
        }
    </style>
</head>

<body>

    <div class="game-box">
        <div class="header">
            <span>Find the pairs.</span>
            <span class="score-badge" id="progressText">Pairs: 0 / 6</span>
        </div>

        <div class="grid-stage" id="gridStage"></div>

        <div class="footer">
            <span style="font-size: 13px; color: #475569;">Click two cards to match a word with its picture.</span>
            <div style="display:flex; gap:8px;">
                <button class="btn" id="showBtn" onclick="showAnswers()">Show answers</button>
                <button class="btn primary" onclick="initGame()">Reset</button>
            </div>
        </div>
    </div>

    <script>
        // === СПИСОК ПАР (Меняй слова и картинки здесь!) ===
        // Если хочешь вставить свою картинку из папки img/, укажи: img: "img/shark.png"
        // Если картинки пока нет, оставь img: "" — игра покажет аккуратную иконку из поля icon
        const PAIRS = [
            { id: 1, word: "shark", img: "", icon: "🦈" },
            { id: 2, word: "whale", img: "", icon: "🐋" },
            { id: 3, word: "dolphin", img: "", icon: "🐬" },
            { id: 4, word: "monkey", img: "", icon: "🐒" },
            { id: 5, word: "snake", img: "", icon: "🐍" },
            { id: 6, word: "duck", img: "", icon: "🦆" }
        ];

        let cards = [];
        let flippedCards = [];
        let matchedCount = 0;
        let lockBoard = false;

        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'en-GB';
            utter.rate = 0.95;
            window.speechSynthesis.speak(utter);
        }

        function playTone(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                if (type === 'match') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.14, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
                    osc.start(); osc.stop(ctx.currentTime + 0.22);
                }
            } catch (e) { }
        }

        function initGame() {
            flippedCards = [];
            matchedCount = 0;
            lockBoard = false;
            updateProgress();

            // Создаем по 2 карточки на каждую пару: 1) слово, 2) картинка
            cards = [];
            PAIRS.forEach(item => {
                cards.push({ pairId: item.id, type: 'word', word: item.word });
                cards.push({ pairId: item.id, type: 'pic', word: item.word, img: item.img, icon: item.icon });
            });

            // Перемешиваем карточки
            cards.sort(() => Math.random() - 0.5);

            const stage = document.getElementById('gridStage');
            stage.innerHTML = '';

            cards.forEach((cardData, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.dataset.index = index;

                const backContent = cardData.type === 'word'
                    ? `<span>${cardData.word}</span>`
                    : (cardData.img ? `<img src="${cardData.img}" alt="${cardData.word}">` : `<span class="emoji-pic">${cardData.icon}</span>`);

                cardEl.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-front">?</div>
          <div class="card-face card-back">${backContent}</div>
        </div>
      `;

                cardEl.onclick = () => flipCard(cardEl, cardData);
                stage.appendChild(cardEl);
            });
        }

        function flipCard(cardEl, cardData) {
            if (lockBoard) return;
            if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

            cardEl.classList.add('flipped');
            if (cardData.type === 'word') {
                speak(cardData.word);
            }

            flippedCards.push({ el: cardEl, data: cardData });

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            lockBoard = true;
            const [first, second] = flippedCards;

            if (first.data.pairId === second.data.pairId) {
                setTimeout(() => {
                    playTone('match');
                    speak(first.data.word);
                    first.el.classList.add('matched');
                    second.el.classList.add('matched');
                    matchedCount++;
                    updateProgress();
                    flippedCards = [];
                    lockBoard = false;
                }, 650);
            } else {
                setTimeout(() => {
                    playTone('wrong');
                    first.el.classList.remove('flipped');
                    second.el.classList.remove('flipped');
                    flippedCards = [];
                    lockBoard = false;
                }, 950);
            }
        }

        function showAnswers() {
            if (lockBoard) return;
            lockBoard = true;
            const allCards = document.querySelectorAll('.card:not(.matched)');
            allCards.forEach(c => c.classList.add('flipped'));
            setTimeout(() => {
                allCards.forEach(c => c.classList.remove('flipped'));
                lockBoard = false;
            }, 2200);
        }

        function updateProgress() {
            document.getElementById('progressText').textContent = `Pairs: ${matchedCount} / ${PAIRS.length}`;
        }

        initGame();
    </script>
</body>

</html>
