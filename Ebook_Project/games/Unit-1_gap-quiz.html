<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose the words to complete the gaps</title>
    <style>
        :root {
            --primary: #1a6bb8;
            --primary-hover: #145491;
            --card-blue: #18a4e0;
            --bg-outer: #f0f4f8;
            --border-color: #cbd5e1;
            --text-dark: #1e293b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 15px;
            background: var(--bg-outer);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-box {
            background: #fff;
            border: 2px solid var(--primary);
            border-radius: 12px;
            width: 100%;
            max-width: 820px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            padding: 18px 24px 10px;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* Основная рабочая зона (картинка слева, задание справа) */
        .main-area {
            display: flex;
            gap: 28px;
            padding: 10px 28px 24px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        /* Левая колонка: Картинка + 5 звездочек */
        .left-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            flex: 0 0 260px;
        }

        .pic-frame {
            width: 260px;
            height: 190px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .pic-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .emoji-fallback {
            font-size: 84px;
            line-height: 1;
        }

        .medals-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .medal {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e2e8f0;
            border: 2px solid #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            color: #94a3b8;
            transition: all 0.35s ease;
        }

        .medal.earned {
            background: #fef08a;
            border-color: #eab308;
            color: #ca8a04;
            transform: scale(1.12);
            box-shadow: 0 2px 6px rgba(234, 179, 8, 0.35);
        }

        /* Правая колонка: Динамик + Предложение + Кнопки */
        .right-col {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            text-align: center;
        }

        .audio-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            background: #e0f2fe;
            color: var(--primary);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
            opacity: 0.35;
            pointer-events: none;
        }

        .audio-btn.active {
            opacity: 1;
            pointer-events: auto;
        }

        .audio-btn.active:hover {
            background: var(--primary);
            color: #fff;
            transform: scale(1.06);
        }

        .sentence-box {
            font-size: 22px;
            line-height: 1.6;
            color: var(--text-dark);
            font-weight: 500;
        }

        .gap-slot {
            display: inline-block;
            min-width: 76px;
            padding: 2px 12px;
            margin: 0 4px;
            border-radius: 6px;
            font-weight: 700;
            text-align: center;
            transition: all 0.25s;
            vertical-align: baseline;
        }

        .gap-slot.empty {
            background: var(--card-blue);
            color: #fff;
            border: 2px solid #0284c7;
        }

        .gap-slot.filled {
            background: #dcfce7;
            color: #15803d;
            border: 2px solid #22c55e;
        }

        .options-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .opt-btn {
            min-width: 110px;
            padding: 10px 22px;
            border-radius: 8px;
            border: 2px solid #94a3b8;
            background: #fff;
            color: var(--text-dark);
            font-size: 19px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 3px 0 #cbd5e1;
        }

        .opt-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f0f9ff;
            transform: translateY(-1px);
        }

        .opt-btn.correct {
            background: #22c55e;
            border-color: #16a34a;
            color: #fff;
            box-shadow: 0 3px 0 #15803d;
        }

        .opt-btn.wrong {
            background: #ef4444;
            border-color: #dc2626;
            color: #fff;
            box-shadow: 0 3px 0 #b91c1c;
            animation: shake 0.35s;
        }

        .opt-btn:disabled {
            cursor: default;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        /* Нижняя панель */
        .footer {
            background: #e2e8f0;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-top: 1px solid var(--border-color);
        }

        .dots-nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #94a3b8;
            transition: 0.2s;
            cursor: pointer;
        }

        .dot.active {
            background: var(--primary);
            transform: scale(1.2);
        }

        .dot.done {
            background: #22c55e;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            background: #fff;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
        }

        .btn:hover:not(:disabled) {
            background: #e0f2fe;
        }

        .btn.primary {
            background: var(--primary);
            color: #fff;
        }

        .btn.primary:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: default;
        }
    </style>
</head>

<body>

    <div class="game-box">
        <div class="header">Choose the words to complete the gaps.</div>

        <div class="main-area">
            <div class="left-col">
                <div class="pic-frame" id="picFrame"></div>
                <div class="medals-row" id="medalsRow"></div>
            </div>

            <div class="right-col">
                <button class="audio-btn" id="audioBtn" title="Listen again" onclick="speakFullSentence()">🔊</button>
                <div class="sentence-box" id="sentenceBox"></div>
                <div class="options-row" id="optionsRow"></div>
            </div>
        </div>

        <div class="footer">
            <div class="dots-nav" id="dotsNav"></div>
            <button class="btn primary" id="nextBtn" onclick="nextQuestion()">Next &rarr;</button>
            <div style="display:flex; gap:8px;">
                <button class="btn" onclick="showAnswer()">Show answers</button>
                <button class="btn" onclick="resetCurrent()">Reset</button>
            </div>
        </div>
    </div>

    <script>
        // === СПИСОК ВОПРОСОВ (Меняй предложения, варианты и картинки здесь!) ===
        // Пропуск в предложении обозначается символом ___ (три нижних подчеркивания)
        // Если есть картинка в папке img/, укажи: img: "img/guitar.jpg", иначе оставь img: "" и поставь icon
        const QUESTIONS = [
            {
                before: "He didn't",
                after: "an instrument last year.",
                options: ["play", "played"],
                correct: "play",
                img: "",
                icon: "🎸"
            },
            {
                before: "Mr Smith",
                after: "history and maths at university.",
                options: ["taught", "teach"],
                correct: "taught",
                img: "",
                icon: "👨‍🏫"
            },
            {
                before: "When",
                after: "this video game? Yesterday.",
                options: ["did you buy", "you bought"],
                correct: "did you buy",
                img: "",
                icon: "🎮"
            },
            {
                before: "We",
                after: "to the museum on Sunday.",
                options: ["go", "went"],
                correct: "went",
                img: "",
                icon: "🏛️"
            },
            {
                before: "She",
                after: "a great photo of the dolphin.",
                options: ["took", "take"],
                correct: "took",
                img: "",
                icon: "📷"
            }
        ];

        let currentIndex = 0;
        let solvedState = new Array(QUESTIONS.length).fill(false);

        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'en-GB';
            utter.rate = 0.92;
            window.speechSynthesis.speak(utter);
        }

        function speakFullSentence() {
            const q = QUESTIONS[currentIndex];
            const fullText = `${q.before} ${q.correct} ${q.after}`;
            speak(fullText);
        }

        function playTone(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.14, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
                    osc.start(); osc.stop(ctx.currentTime + 0.22);
                }
            } catch (e) { }
        }

        function renderQuestion() {
            const q = QUESTIONS[currentIndex];
            const isSolved = solvedState[currentIndex];

            // Картинка слева
            const picFrame = document.getElementById('picFrame');
            picFrame.innerHTML = q.img
                ? `<img src="${q.img}" alt="Picture">`
                : `<span class="emoji-fallback">${q.icon}</span>`;

            // Кнопка динамика
            const audioBtn = document.getElementById('audioBtn');
            if (isSolved) {
                audioBtn.classList.add('active');
            } else {
                audioBtn.classList.remove('active');
            }

            // Предложение с пропуском
            const sentenceBox = document.getElementById('sentenceBox');
            const gapHtml = isSolved
                ? `<span class="gap-slot filled">${q.correct}</span>`
                : `<span class="gap-slot empty" id="gapSlot">?</span>`;
            sentenceBox.innerHTML = `${q.before} ${gapHtml} ${q.after}`;

            // Кнопки вариантов ответа
            const optionsRow = document.getElementById('optionsRow');
            optionsRow.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.textContent = opt;
                if (isSolved) {
                    btn.disabled = true;
                    if (opt === q.correct) btn.classList.add('correct');
                } else {
                    btn.onclick = () => checkAnswer(btn, opt);
                }
                optionsRow.appendChild(btn);
            });

            renderMedals();

            renderDots();
        }
        function checkAnswer(btn, chosen) {
            const q = QUESTIONS[currentIndex];
            if (chosen === q.correct) {
                solvedState[currentIndex] = true;
                playTone('win');
                renderQuestion();
                setTimeout(() => speakFullSentence(), 350);
            } else {
                playTone('err');
                btn.classList.add('wrong');
                setTimeout(() => btn.classList.remove('wrong'), 400);
            }
        }
        function showAnswer() {
            solvedState[currentIndex] = true;
            renderQuestion();
            speakFullSentence();
        }
        function resetCurrent() {
            solvedState[currentIndex] = false;
            renderQuestion();
        }
        function nextQuestion() {
            currentIndex = (currentIndex + 1) % QUESTIONS.length;
            renderQuestion();
        }
        function renderMedals() {
            const row = document.getElementById('medalsRow');
            row.innerHTML = '';
            QUESTIONS.forEach((_, idx) => {
                const m = document.createElement('div');
                m.className = 'medal' + (solvedState[idx] ? ' earned' : '');
                m.textContent = '★';
                row.appendChild(m);
            });
        }
        function renderDots() {
            const nav = document.getElementById('dotsNav');
            nav.innerHTML = '';
            QUESTIONS.forEach((_, idx) => {
                const dot = document.createElement('div');
                dot.className = 'dot' + (idx === currentIndex ? ' active' : '') + (solvedState[idx] ? ' done' : '');
                dot.onclick = () => { currentIndex = idx; renderQuestion(); };
                nav.appendChild(dot);
            });
        }
        renderQuestion();
    </script>
</body>

</html>
