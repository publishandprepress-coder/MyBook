<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make the words</title>
<style>
  :root {
    --primary: #1a6bb8;
    --primary-hover: #145491;
    --card-blue: #18a4e0;
    --bg-outer: #f0f4f8;
    --border-color: #cbd5e1;
    --text-dark: #1e293b;
  }
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
  body { margin: 0; padding: 15px; background: var(--bg-outer); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .game-box { background: #fff; border: 2px solid var(--primary); border-radius: 12px; width: 100%; max-width: 820px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); overflow: hidden; }
  .header { padding: 16px 24px 8px; font-size: 20px; font-weight: 600; color: var(--text-dark); display: flex; justify-content: space-between; align-items: center; }
  .hint-badge { font-size: 14px; background: #e0f2fe; color: #0369a1; padding: 4px 12px; border-radius: 20px; font-weight: 500; }
  .main-area { display: flex; gap: 20px; padding: 12px 24px 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  
  /* Клавиатура слева */
  .keyboard { display: grid; grid-template-columns: repeat(4, 38px); gap: 6px; background: #f8fafc; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); }
  .key-btn { height: 38px; border: 1px solid #94a3b8; background: #fff; border-radius: 6px; font-size: 18px; font-weight: 600; color: var(--text-dark); cursor: pointer; transition: all 0.15s; box-shadow: 0 2px 0 #cbd5e1; }
  .key-btn:hover:not(:disabled) { background: #e0f2fe; border-color: var(--primary); transform: translateY(-1px); }
  .key-btn:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
  .key-btn:disabled { opacity: 0.25; cursor: default; box-shadow: none; background: #e2e8f0; }

  /* Центральное поле со словом */
  .word-stage { flex: 1; min-width: 280px; min-height: 220px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; position: relative; }
  .cards-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .letter-card { width: 52px; height: 64px; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: 700; transition: transform 0.3s, background 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  .letter-card.hidden { background: var(--card-blue); color: #fff; border: 2px solid #0284c7; }
  .letter-card.revealed { background: #ffffff; color: var(--text-dark); border: 2px solid #94a3b8; }
  .letter-card.win-bounce { animation: bounceWave 0.5s ease; border-color: #22c55e; color: #15803d; }

  @keyframes bounceWave {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-16px); }
  }

  /* Индикатор попыток (Шарик) справа */
  .balloon-track { width: 50px; height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; position: relative; padding: 10px 0; }
  .track-dots { position: absolute; top: 35px; bottom: 20px; width: 2px; border-left: 2px dashed #cbd5e1; z-index: 1; }
  .balloon { width: 36px; height: 44px; background: radial-gradient(circle at 30% 30%, #ff6b6b, #dc2626); border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%; z-index: 2; transition: transform 0.4s ease; position: relative; box-shadow: 0 4px 8px rgba(220,38,38,0.3); }
  .balloon::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 7px solid #dc2626; }

  /* Нижняя панель */
  .footer { background: #e2e8f0; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-top: 1px solid var(--border-color); }
  .dots-nav { display: flex; gap: 8px; align-items: center; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #94a3b8; transition: 0.2s; }
  .dot.active { background: var(--primary); transform: scale(1.2); }
  .dot.done { background: #22c55e; }
  .btn { padding: 8px 18px; border-radius: 20px; border: 1px solid var(--primary); background: #fff; color: var(--primary); font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.15s; }
  .btn:hover:not(:disabled) { background: #e0f2fe; }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>

<div class="game-box">
  <div class="header">
    <span>Make the words. Click on the letters.</span>
    <span class="hint-badge" id="hintText">Подсказка: квадрат</span>
  </div>

  <div class="main-area">
    <div class="keyboard" id="keyboard"></div>

    <div class="word-stage">
      <div class="cards-row" id="cardsRow"></div>
    </div>

    <div class="balloon-track">
      <div class="track-dots"></div>
      <div class="balloon" id="balloon"></div>
    </div>
  </div>

  <div class="footer">
    <div class="dots-nav" id="dotsNav"></div>
    <button class="btn primary" id="nextBtn" onclick="nextWord()">Next &rarr;</button>
    <div style="display:flex; gap:8px;">
      <button class="btn" onclick="showAnswer()">Show answer</button>
      <button class="btn" onclick="resetCurrent()">Reset</button>
    </div>
  </div>
</div>

<script>
  // === СПИСОК СЛОВ (Меняй слова и подсказки здесь!) ===
  const WORDS = [
    { word: "square", hint: "Геометрическая фигура (квадрат)" },
    { word: "camera", hint: "Устройство для фотографий" },
    { word: "guitar", hint: "Музыкальный инструмент" },
    { word: "monkey", hint: "Животное, которое любит бананы" },
    { word: "dolphin", hint: "Умное морское млекопитающее" }
  ];

  const ALPHABET = "abcdefghijklmnopqrstuvwxyz".split("");
  const MAX_ERRORS = 6;
  let currentIndex = 0;
  let guessedLetters = [];
  let errors = 0;
  let solvedWords = new Array(WORDS.length).fill(false);

  // Озвучка букв и слов (английский голос)
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-GB';
    utter.rate = 0.95;
    window.speechSynthesis.speak(utter);
  }

  // Простые звуковые эффекты (звоночек победы и мягкий звук ошибки)
  function playTone(type) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12);
        osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.24);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.start(); osc.stop(ctx.currentTime + 0.5);
      } else if (type === 'err') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(160, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
        osc.start(); osc.stop(ctx.currentTime + 0.25);
      }
    } catch(e) {}
  }

  function initWord() {
    guessedLetters = [];
    errors = 0;
    const item = WORDS[currentIndex];
    document.getElementById('hintText').textContent = "Hint: " + item.hint;
    updateBalloon();
    renderKeyboard();
    renderCards(false);
    renderDots();
  }

  function renderKeyboard() {
    const kb = document.getElementById('keyboard');
    kb.innerHTML = '';
    ALPHABET.forEach(letter => {
      const btn = document.createElement('button');
      btn.className = 'key-btn';
      btn.textContent = letter;
      btn.disabled = guessedLetters.includes(letter) || errors >= MAX_ERRORS || isWordComplete();
      btn.onclick = () => handleLetter(letter);
      kb.appendChild(btn);
    });
  }

  function renderCards(animateWin) {
    const row = document.getElementById('cardsRow');
    row.innerHTML = '';
    const word = WORDS[currentIndex].word.toLowerCase();
    word.split('').forEach((char, idx) => {
      const card = document.createElement('div');
      const revealed = guessedLetters.includes(char);
      card.className = 'letter-card ' + (revealed ? 'revealed' : 'hidden');
      card.textContent = revealed ? char : '?';
      if (animateWin) {
        setTimeout(() => card.classList.add('win-bounce'), idx * 80);
      }
      row.appendChild(card);
    });
  }

  function isWordComplete() {
    const word = WORDS[currentIndex].word.toLowerCase();
    return word.split('').every(ch => guessedLetters.includes(ch));
  }

  function handleLetter(letter) {
    if (guessedLetters.includes(letter)) return;
    guessedLetters.push(letter);
    speak(letter);

    const word = WORDS[currentIndex].word.toLowerCase();
    if (!word.includes(letter)) {
      errors++;
      updateBalloon();
      playTone('err');
      if (errors >= MAX_ERRORS) {
        setTimeout(() => showAnswer(), 500);
      }
    } else if (isWordComplete()) {
      solvedWords[currentIndex] = true;
      renderCards(true);
      renderKeyboard();
      renderDots();
      setTimeout(() => {
        playTone('win');
        speak(word);
      }, 450);
      return;
    }
    renderCards(false);
    renderKeyboard();
  }

  function updateBalloon() {
    const balloon = document.getElementById('balloon');
    const step = (150 / MAX_ERRORS) * errors;

balloon.style.transform = `translateY(${step}px) scale(${1 - errors * 0.05})`;
}
function showAnswer() {
const word = WORDS[currentIndex].word.toLowerCase();
guessedLetters = [...new Set(word.split(''))];
renderCards(true);
renderKeyboard();
speak(word);
}
function resetCurrent() {
solvedWords[currentIndex] = false;
initWord();
}
function nextWord() {
currentIndex = (currentIndex + 1) % WORDS.length;
initWord();
}
function renderDots() {
const nav = document.getElementById('dotsNav');
nav.innerHTML = '';
WORDS.forEach((_, idx) => {
const dot = document.createElement('div');
dot.className = 'dot' + (idx === currentIndex ? ' active' : '') + (solvedWords[idx] ? ' done' : '');
dot.style.cursor = 'pointer';
dot.onclick = () => { currentIndex = idx; initWord(); };
nav.appendChild(dot);
});
}
initWord();
</script>
</body>
</html>
