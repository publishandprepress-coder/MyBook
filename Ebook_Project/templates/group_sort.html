<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Sort</title>
    <style>
        :root {
            --primary: #1a6bb8;
            --primary-hover: #145491;
            --card-blue: #18a4e0;
            --bg-outer: #f0f4f8;
            --border-color: #cbd5e1;
            --text-dark: #1e293b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 15px;
            background: var(--bg-outer);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-box {
            background: #fff;
            border: 2px solid var(--primary);
            border-radius: 12px;
            width: 100%;
            max-width: 820px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            padding: 16px 24px 8px;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-badge {
            font-size: 14px;
            background: #e0f2fe;
            color: #0369a1;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* Верхняя зона: Банк неразобранных слов */
        .word-bank {
            margin: 10px 24px 18px;
            padding: 14px;
            min-height: 76px;
            background: #f8fafc;
            border: 2px dashed #94a3b8;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .word-chip {
            padding: 8px 16px;
            background: #fff;
            border: 2px solid #94a3b8;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            color: var(--text-dark);
            cursor: grab;
            transition: all 0.2s;
            box-shadow: 0 3px 0 #cbd5e1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .word-chip:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .word-chip.selected {
            border-color: var(--primary);
            background: #e0f2fe;
            box-shadow: 0 0 0 3px rgba(26, 107, 184, 0.25);
            transform: translateY(-2px);
        }

        .word-chip.correct {
            background: #dcfce7;
            border-color: #22c55e;
            color: #15803d;
            box-shadow: none;
            cursor: default;
        }

        .word-chip.wrong {
            background: #fee2e2;
            border-color: #ef4444;
            color: #b91c1c;
            animation: shake 0.35s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        /* Нижняя зона: Корзины / Колонки */
        .baskets-grid {
            padding: 0 24px 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .basket {
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            min-height: 210px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: 0.2s;
            cursor: pointer;
        }

        .basket.drag-over {
            border-color: var(--primary);
            background: #f0f9ff;
            transform: scale(1.01);
        }

        .basket-header {
            padding: 12px;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            color: #fff;
            background: var(--primary);
        }

        .basket[data-color="blue"] .basket-header {
            background: #1a6bb8;
        }

        .basket[data-color="teal"] .basket-header {
            background: #0d9488;
        }

        .basket[data-color="amber"] .basket-header {
            background: #d97706;
        }

        .basket-body {
            flex: 1;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        /* Нижняя панель */
        .footer {
            background: #e2e8f0;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            background: #fff;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
        }

        .btn:hover:not(:disabled) {
            background: #e0f2fe;
        }

        .btn.primary {
            background: var(--primary);
            color: #fff;
        }

        .btn.primary:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: default;
        }
    </style>
</head>

<body>

    <div class="game-box">
        <div class="header">
            <span id="taskTitle">Put the words into the correct group.</span>
            <span class="score-badge" id="scoreBadge">Sorted: 0 / 9</span>
        </div>

        <div class="word-bank" id="wordBank"></div>

        <div class="baskets-grid" id="basketsGrid"></div>

        <div class="footer">
            <span style="font-size: 13px; color: #475569;">Drag a word to a box, or click a word and then click a
                box.</span>
            <div style="display:flex; gap:8px;">
                <button class="btn" onclick="showAnswers()">Show answers</button>
                <button class="btn primary" onclick="initGame()">Reset</button>
            </div>
        </div>
    </div>

    <script>
        // === НАСТРОЙКИ КАТЕГОРИЙ И СЛОВ (Меняй темы и слова здесь!) ===
        // Можно сделать 2 или 3 корзины. Цвета (color): "blue", "teal", "amber"
        const CATEGORIES = [
            { id: "countable", title: "Countable (Исчисляемые)", color: "blue" },
            { id: "uncountable", title: "Uncountable (Неисчисляемые)", color: "teal" }
        ];

        const ITEMS = [
            { word: "apple", cat: "countable", icon: "🍎" },
            { word: "banana", cat: "countable", icon: "🍌" },
            { word: "egg", cat: "countable", icon: "🥚" },
            { word: "carrot", cat: "countable", icon: "🥕" },
            { word: "water", cat: "uncountable", icon: "💧" },
            { word: "milk", cat: "uncountable", icon: "🥛" },
            { word: "rice", cat: "uncountable", icon: "🍚" },
            { word: "cheese", cat: "uncountable", icon: "🧀" },
            { word: "bread", cat: "uncountable", icon: "🍞" }
        ];

        let selectedItem = null;
        let sortedCount = 0;

        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'en-GB';
            utter.rate = 0.95;
            window.speechSynthesis.speak(utter);
        }

        function playTone(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                if (type === 'ok') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.14, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                    osc.start(); osc.stop(ctx.currentTime + 0.35);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(190, ctx.currentTime);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
                    osc.start(); osc.stop(ctx.currentTime + 0.22);
                }
            } catch (e) { }
        }

        function initGame() {
            selectedItem = null;
            sortedCount = 0;
            updateScore();

            // Отрисовываем банк перемешанных слов
            const bank = document.getElementById('wordBank');
            bank.innerHTML = '';
            const shuffled = [...ITEMS].sort(() => Math.random() - 0.5);

            shuffled.forEach((item, idx) => {
                const chip = createChip(item, idx);
                bank.appendChild(chip);
            });

            // Отрисовываем корзины
            const grid = document.getElementById('basketsGrid');
            grid.innerHTML = '';

            CATEGORIES.forEach(cat => {
                const basket = document.createElement('div');
                basket.className = 'basket';
                basket.dataset.cat = cat.id;
                basket.dataset.color = cat.color;

                basket.innerHTML = `
        <div class="basket-header">${cat.title}</div>
        <div class="basket-body" id="body-${cat.id}"></div>
      `;

                // Обработка клика по корзине (если слово выделено)
                basket.onclick = () => {
                    if (selectedItem) {
                        attemptDrop(selectedItem.el, selectedItem.data, cat.id);
                    }
                };

                // Обработка перетаскивания (Drag & Drop)
                basket.ondragover = (e) => {
                    e.preventDefault();
                    basket.classList.add('drag-over');
                };
                basket.ondragleave = () => basket.classList.remove('drag-over');
                basket.ondrop = (e) => {
                    e.preventDefault();
                    basket.classList.remove('drag-over');
                    if (selectedItem) {
                        attemptDrop(selectedItem.el, selectedItem.data, cat.id);
                    }
                };

                grid.appendChild(basket);
            });
        }

        function createChip(item, idx) {
            const chip = document.createElement('div');
            chip.className = 'word-chip';
            chip.draggable = true;
            chip.innerHTML = `<span>${item.icon}</span><span>${item.word}</span>`;

            chip.onclick = (e) => {
                e.stopPropagation();
                speak(item.word);
                document.querySelectorAll('.word-chip').forEach(c => c.classList.remove('selected'));
                chip.classList.add('selected');
                selectedItem = { el: chip, data: item };
            };

            chip.ondragstart = () => {
                speak(item.word);
                document.querySelectorAll('.word-chip').forEach(c => c.classList.remove('selected'));
                chip.classList.add('selected');
                selectedItem = { el: chip, data: item };
            };

            return chip;
        }

        function attemptDrop(chipEl, itemData, targetCatId) {
            if (itemData.cat === targetCatId) {
                playTone('ok');
                chipEl.classList.remove('selected');
                chipEl.classList.add('correct');
                chipEl.draggable = false;
                chipEl.onclick = () => speak(itemData.word);
                document.getElementById(`body-${targetCatId}`).appendChild(chipEl);
                selectedItem = null;
                sortedCount++;
                updateScore();
                if (sortedCount === ITEMS.length) {
                    document.getElementById('wordBank').innerHTML = '<span style="color:#15803d; font-weight:600; font-size:18px;">🎉 Well done! All words sorted!</span>';
                }
            } else {
                playTone('err');
                chipEl.classList.add('wrong');
                setTimeout(() => chipEl.classList.remove('wrong'), 400);
            }
        }

        function showAnswers() {
            document.getElementById('wordBank').innerHTML = '<span style="color:#15803d; font-weight:600; font-size:18px;">All answers shown!</span>';
            CATEGORIES.forEach(cat => {
                document.getElementById(`body-${cat.id}`).innerHTML = '';
            });

            ITEMS.forEach((item, idx) => {
                const chip = createChip(item, idx);
                chip.classList.add('correct');
                chip.draggable = false;
                chip.onclick = () => speak(item.word);
                document.getElementById(`body-${item.cat}`).appendChild(chip);
            });
            sortedCount = ITEMS.length;
            updateScore();
        }
        function updateScore() {
            document.getElementById('scoreBadge').textContent = `Sorted: ${sortedCount} / ${ITEMS.length}`;
        }
        initGame();
    </script>
</body>

</html>
